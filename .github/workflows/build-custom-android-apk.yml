name: Build Custom Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute unique build tag
        id: meta
        run: |
          STAMP=$(TZ='Asia/Shanghai' date +%m%d-%H%M)
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TAG="b${GITHUB_RUN_NUMBER}-${STAMP}-${SHORT_SHA}"
          VERSION_CODE=$((35 + GITHUB_RUN_NUMBER))
          BASE_VERSION=$(node -p "require('./mobile/app.json').expo.version")
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${BASE_VERSION}-${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "APK build tag: ${BUILD_TAG} (versionName=${BASE_VERSION}-${BUILD_TAG}, versionCode=${VERSION_CODE})"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack (pnpm 12)
        run: corepack enable

      - name: Install root workspace packages
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node config/scripts/workspace-package-build/build-workspace-packages.mjs

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android native project
        working-directory: mobile
        env:
          ORCA_ANDROID_DISABLE_GOOGLE_SERVICES: 'true'
          ORCA_ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          ORCA_BUILD_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Release APK (ARM64 + ARMv7)
        working-directory: mobile/android
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          OUT_APK="../orca-reset-android-${{ steps.meta.outputs.build_tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT_APK"
          ls -lh "$OUT_APK"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orca-Reset-Android-${{ steps.meta.outputs.build_tag }}
          path: mobile/orca-reset-android-${{ steps.meta.outputs.build_tag }}.apk
          retention-days: 14

      - name: Publish to GitHub Release (direct APK download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-${{ steps.meta.outputs.build_tag }}"
          gh release create "$TAG" \
            "mobile/orca-reset-android-${{ steps.meta.outputs.build_tag }}.apk" \
            --title "Android APK ${{ steps.meta.outputs.build_tag }}" \
            --notes "Commit: ${{ github.sha }} | Version: ${{ steps.meta.outputs.version_name }} (code ${{ steps.meta.outputs.version_code }})" \
            --prerelease
