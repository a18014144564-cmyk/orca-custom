name: Build Custom Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack (pnpm 12)
        run: corepack enable

      - name: Install root workspace packages
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node config/scripts/workspace-package-build/build-workspace-packages.mjs

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android native project
        working-directory: mobile
        env:
          ORCA_ANDROID_DISABLE_GOOGLE_SERVICES: 'true'
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Release APK (ARM64 + ARMv7)
        working-directory: mobile/android
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk ../orca-reset-android.apk
          ls -lh ../orca-reset-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orca-Reset-android-apk
          path: mobile/orca-reset-android.apk
          retention-days: 14
