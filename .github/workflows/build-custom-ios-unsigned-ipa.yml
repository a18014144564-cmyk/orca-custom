name: Build Custom iOS Unsigned IPA (Self-Sign)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Optional iOS Bundle Identifier for self-signing'
        required: false
        default: 'com.stably.orca.mobile.reset'

jobs:
  build-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute unique build tag
        id: meta
        run: |
          STAMP=$(TZ='Asia/Shanghai' date +%m%d-%H%M)
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TAG="b${GITHUB_RUN_NUMBER}-${STAMP}-${SHORT_SHA}"
          VERSION_CODE=$((35 + GITHUB_RUN_NUMBER))
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "iOS build tag: ${BUILD_TAG} (buildNumber=${VERSION_CODE})"

      - name: Select newest available Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting $NEWEST_XCODE"
          sudo xcode-select -s "$NEWEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack (pnpm 12)
        run: corepack enable

      - name: Install root workspace packages
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node config/scripts/workspace-package-build/build-workspace-packages.mjs

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Prebuild iOS native project
        working-directory: mobile
        env:
          ORCA_IOS_APS_ENVIRONMENT: development
          ORCA_BUILD_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Build unsigned Release .app
        working-directory: mobile/ios
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          xcodebuild \
            -workspace Orca.xcworkspace \
            -scheme Orca \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Orca.app Payload/
          zip -r -y ../orca-reset-ios-${{ steps.meta.outputs.build_tag }}.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orca-Reset-iOS-${{ steps.meta.outputs.build_tag }}
          path: mobile/orca-reset-ios-${{ steps.meta.outputs.build_tag }}.ipa
          retention-days: 14
